[build-system]
requires = ["setuptools>=75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TA.support"
version = "0.1.0"
description = "Biblioteca de suporte do Transfero Academy"
authors = [{name = "Seu Nome", email = "sergio.wellington@email.com"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
 "sqlalchemy>=2.0"
]
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[tool.setuptools.packages.find]
where = ["src"]
